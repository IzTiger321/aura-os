<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AuraOS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--accent:#6366f1;--op:.92;--blur:18px;--rad:13px;--fs:14px;--cell:80px;--is:38px;
--fg:#f8fafc;--muted:#94a3b8;--p:15,23,42;--l:255,255,255}
:root[data-theme=light]{--fg:#0f172a;--muted:#475569;--p:248,250,252;--l:0,0,0}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:#0b1020;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
input,textarea{user-select:text;-webkit-user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#desktop{position:absolute;inset:44px 0 62px;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,var(--cell));grid-auto-rows:calc(var(--cell) + 10px);gap:8px;align-content:start;overflow:auto;background-size:cover;background-position:center}
#topbar,#dock{position:absolute;left:0;right:0;z-index:1000;background:rgba(var(--p),.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:0 solid rgba(var(--l),.12)}
#topbar{top:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom-width:1px;font-size:12px;padding-top:env(safe-area-inset-top)}
#dock{bottom:0;height:62px;display:flex;align-items:center;gap:8px;border-top-width:1px;padding:0 10px env(safe-area-inset-bottom)}
#taskbar{display:flex;gap:6px;align-items:center;overflow-x:auto;flex:1;justify-content:center;scrollbar-width:none}
.tb{background:none;border:0;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px}
.tb:hover{background:rgba(var(--l),.1)}
.desktop-icon{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:4px;border-radius:12px;background:transparent;border:1px solid transparent;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.7);color:#fff}
.desktop-icon:hover,.desktop-icon.sel{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
.desktop-icon i{font-size:var(--is)}
.desktop-icon img,.ico{width:var(--is);height:var(--is);object-fit:contain;border-radius:9px}
.desktop-icon span{font-size:11px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-button{width:42px;height:42px;flex:0 0 auto;border:0;border-radius:10px;background:rgba(var(--l),.1);position:relative}
.task-button.active{background:rgba(var(--l),.25)}
.task-button.active::after{content:"";position:absolute;bottom:3px;left:50%;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--accent)}
.task-button img{width:22px;height:22px;object-fit:contain}
#windowLayer{position:absolute;inset:44px 0 62px;pointer-events:none;z-index:10;overflow:hidden}
.window{position:absolute;display:flex;flex-direction:column;min-width:260px;min-height:190px;max-width:100%;max-height:100%;pointer-events:auto;overflow:hidden;border:1px solid rgba(var(--l),.2);border-radius:var(--rad);background:rgba(var(--p),var(--op));backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:0 20px 55px rgba(0,0,0,.4);font-size:var(--fs)}
.anim .window{animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.window.active{border-color:rgba(var(--l),.45)}
.window.maxed,body.mob .window{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win-header{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;background:rgba(var(--l),.06);border-bottom:1px solid rgba(var(--l),.1);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.win-title{font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win-controls{display:flex;gap:3px}
.win-controls button{width:32px;height:32px;border:0;border-radius:8px;background:transparent}
.win-controls button:hover{background:rgba(var(--l),.14)}
.win-controls .close:hover{background:#dc2626;color:#fff}
body.mob .win-controls .max,body.mob .resize{display:none}
.win-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;position:relative}
.resize{position:absolute;bottom:0;right:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none}
.ui{width:100%;min-width:0;padding:9px 11px;background:rgba(var(--l),.08);border:1px solid rgba(var(--l),.18);border-radius:9px}
select.ui option{color:#000}
.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--accent);color:#fff;font-size:12px;font-weight:600}
.sec{border:1px solid rgba(var(--l),.16);border-radius:9px;background:rgba(var(--l),.08);padding:8px 12px;font-size:12px}
.sec:hover{background:rgba(var(--l),.16)}
.danger{background:rgba(220,38,38,.18);border:1px solid rgba(239,68,68,.35);border-radius:9px;color:#f87171;padding:8px 12px;font-size:12px}
.row{display:flex;gap:6px;align-items:center}
.pad{padding:14px}
.muted{color:var(--muted);font-size:11px}
#startMenu{position:absolute;z-index:1100;bottom:70px;left:10px;width:min(400px,calc(100vw - 20px));max-height:calc(100% - 130px);overflow:auto;padding:14px;border-radius:16px;border:1px solid rgba(var(--l),.18);background:rgba(var(--p),.97);backdrop-filter:blur(25px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
#startMenu[hidden],#ctx[hidden]{display:none}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
.start-app{padding:10px 2px;border:0;border-radius:10px;background:transparent;min-width:0;text-align:center}
.start-app:hover{background:rgba(var(--l),.12)}
.start-app i{font-size:25px;display:block;margin-bottom:6px}
.start-app img{width:28px;height:28px;object-fit:contain;display:block;margin:0 auto 6px}
.start-app span{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;z-index:3000;bottom:75px;left:50%;transform:translateX(-50%);padding:10px 15px;border-radius:10px;background:#111827;color:#f8fafc;border:1px solid rgba(255,255,255,.2);font-size:12px;display:none;max-width:90%}
.bar{display:flex;gap:5px;padding:7px;background:rgba(0,0,0,.18);border-bottom:1px solid rgba(var(--l),.1)}
.wv{flex:1;min-height:0;position:relative;background:#fff}
.wv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.start{position:absolute;inset:0;overflow:auto;padding:24px 14px;background:rgba(var(--p),1);text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,90px);gap:10px;justify-content:center;margin-top:20px}
.tile{padding:10px 4px;border:0;border-radius:12px;background:rgba(var(--l),.07);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile img{width:30px;height:30px;display:block;margin:0 auto 6px}
.hint{font-size:10px;padding:4px 8px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint button{background:none;border:0;color:var(--accent);padding:0;font-size:10px;text-decoration:underline}
.set{display:flex;flex:1;min-height:0}
.set nav{width:150px;flex:none;border-right:1px solid rgba(var(--l),.1);padding:8px;overflow:auto}
.set nav button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;font-size:12px}
.set nav button.on,.set nav button:hover{background:rgba(var(--l),.12)}
.set main{flex:1;min-width:0;overflow:auto;padding:14px}
.set h3{margin:0 0 4px;font-size:14px}
.grp{padding:12px 0;border-bottom:1px solid rgba(var(--l),.1)}
.grp label{display:block;font-size:11px;margin:8px 0 4px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(var(--l),.7);padding:0}
.wp{width:56px;height:38px;border-radius:8px;border:2px solid rgba(var(--l),.4);background-size:cover;padding:0}
.li{display:flex;align-items:center;gap:9px;padding:8px;margin:6px 0;border:1px solid rgba(var(--l),.12);border-radius:9px}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li img{width:26px;height:26px;object-fit:contain}
.term{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:rgba(0,0,0,.35);color:#e2e8f0;flex:1;overflow:auto;padding:10px;white-space:pre-wrap;word-break:break-word}
.term input{background:none;border:0;outline:0;width:70%;font:inherit;color:inherit}
@media(max-width:650px){.set{flex-direction:column}.set nav{width:100%;display:flex;border-right:0;border-bottom:1px solid rgba(var(--l),.1);overflow-x:auto}.set nav button{width:auto;white-space:nowrap}.grid4{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="anim">

<header id="topbar">
  <div class="row" style="gap:10px;min-width:0">
    <button class="tb" onclick="toggleStart()" style="font-weight:700"><i class="fa-solid fa-layer-group" style="color:var(--accent)"></i>AuraOS</button>
    <span style="opacity:.4">|</span><span id="activeTitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Desktop</span>
  </div>
  <div class="row" style="gap:6px">
    <span id="clock"></span>
    <button class="tb" id="fsBtn" onclick="toggleFS()" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
    <button class="tb" onclick="powerMenu()" title="Power" style="color:#f87171"><i class="fa-solid fa-power-off"></i></button>
  </div>
</header>

<main id="desktop"></main>
<div id="windowLayer"></div>

<div id="startMenu" hidden>
  <input class="ui" id="startSearch" placeholder="Search apps…" autocomplete="off">
  <div id="startApps" class="grid4"></div>
  <div class="row" style="justify-content:space-between;border-top:1px solid rgba(var(--l),.12);padding-top:10px">
    <button class="sec" onclick="openApp('settings');closeStart()"><i class="fa-solid fa-gear"></i> Settings</button>
    <span><button class="sec" onclick="location.reload()">Restart</button> <button class="danger" onclick="exitOS()">Exit</button></span>
  </div>
</div>

<footer id="dock">
  <button class="task-button" onclick="toggleStart()" title="Start"><i class="fa-solid fa-layer-group" style="color:var(--accent);font-size:18px"></i></button>
  <div id="taskbar"></div>
</footer>
<div id="toast"></div>

<script>
"use strict";
const P="auraos_v6_", $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const mem={};
function ls(k,f){try{const v=localStorage.getItem(P+k);return v===null?(k in mem?mem[k]:f):JSON.parse(v)}catch{return k in mem?mem[k]:f}}
function ss(k,v){mem[k]=v;try{localStorage.setItem(P+k,JSON.stringify(v));return true}catch{toast("Storage full or blocked by browser");return false}}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}
function validURL(v){try{const u=new URL(v);return/^https?:$/.test(u.protocol)?u.href:null}catch{return null}}
const fallbackIcon="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#6366f1"/><text x="32" y="43" font-size="32" text-anchor="middle" fill="#fff" font-family="sans-serif">A</text></svg>');
const favicon=u=>{try{return"https://www.google.com/s2/favicons?domain="+encodeURIComponent(new URL(u).hostname)+"&sz=128"}catch{return fallbackIcon}};
const DEF_WP="linear-gradient(135deg,#1e1b4b,#312e81 45%,#0f172a)";
const WALLS=[DEF_WP,"linear-gradient(135deg,#0f172a,#0e7490)","linear-gradient(135deg,#4c1d95,#be185d)","linear-gradient(135deg,#052e16,#166534)","linear-gradient(135deg,#7c2d12,#f59e0b)","linear-gradient(135deg,#111,#374151)","https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop"];

/* ---------- STATE ---------- */
const DEF={theme:"dark",accent:"#6366f1",wallpaper:DEF_WP,opacity:.92,blur:18,rad:13,fs:14,anim:true,
 iconSize:38,showLabels:true,openMode:"auto",clock24:false,seconds:false,
 search:"https://en.wikipedia.org/w/index.php?search=%s",home:"aura://start",embedDefault:"direct",proxy:"",
 exitUrl:"https://sites.google.com/view/70u0j2glsd19/07Z19U53QSYS"};
let S={...DEF,...ls("settings",{})};
let apps=ls("apps",null);
if(!Array.isArray(apps)){ // migrate from v5
  try{apps=JSON.parse(localStorage.getItem("auraos_v5_apps")||"[]")}catch{apps=[]}
  if(!Array.isArray(apps))apps=[];
}
let files=ls("files",null);
if(!Array.isArray(files)){files=[];
  try{const n=JSON.parse(localStorage.getItem("auraos_v5_notes")||'""');if(n)files.push({id:uid(),name:"Notes.txt",mime:"text/plain",text:true,data:n,mtime:Date.now()})}catch{}}
let tasks=ls("tasks",[]);
const saveS=()=>ss("settings",S), saveApps=()=>ss("apps",apps), saveFiles=()=>{const ok=ss("files",files);dispatchEvent(new Event("fs"));return ok}, saveTasks=()=>ss("tasks",tasks);
const W={};let Z=100;

function applySettings(){
  const r=document.documentElement.style;
  document.documentElement.dataset.theme=S.theme;
  r.setProperty("--accent",S.accent);r.setProperty("--op",S.opacity);r.setProperty("--blur",S.blur+"px");
  r.setProperty("--rad",S.rad+"px");r.setProperty("--fs",S.fs+"px");r.setProperty("--is",S.iconSize+"px");r.setProperty("--cell",(+S.iconSize+42)+"px");
  const w=S.wallpaper||DEF_WP;
  $("#desktop").style.backgroundImage=/^(linear|radial)-gradient/.test(w)?w:`url("${w}")`;
  document.body.classList.toggle("anim",!!S.anim);
  $('meta[name=theme-color]').content=S.theme==="light"?"#f8fafc":"#0b1020";
  updateClock();
}

/* ---------- APP REGISTRY ---------- */
const BUILTIN=[
 {id:"browser",name:"Browser",fa:"fa-solid fa-globe",color:"#fb923c",init:(b,w,a)=>webview(b,w,{url:a.url||S.home,mode:S.embedDefault})},
 {id:"files",name:"Files",fa:"fa-solid fa-folder-open",color:"#60a5fa",init:initFiles},
 {id:"editor",name:"Editor",fa:"fa-solid fa-file-pen",color:"#fbbf24",init:initEditor},
 {id:"calculator",name:"Calculator",fa:"fa-solid fa-calculator",color:"#34d399",init:initCalc},
 {id:"tasks",name:"Tasks",fa:"fa-solid fa-list-check",color:"#f472b6",init:initTasks},
 {id:"clock",name:"Clock",fa:"fa-regular fa-clock",color:"#a78bfa",init:initClock},
 {id:"paint",name:"Paint",fa:"fa-solid fa-paintbrush",color:"#f87171",init:initPaint},
 {id:"media",name:"Media",fa:"fa-solid fa-circle-play",color:"#22d3ee",init:initMedia},
 {id:"terminal",name:"Terminal",fa:"fa-solid fa-terminal",color:"#4ade80",init:initTerm},
 {id:"store",name:"App Store",fa:"fa-solid fa-bag-shopping",color:"#818cf8",init:initStore},
 {id:"settings",name:"Settings",fa:"fa-solid fa-gear",color:"#cbd5e1",init:initSettings}
];
const CATALOG=[
 {name:"Wikipedia",url:"https://en.m.wikipedia.org/"},
 {name:"OpenStreetMap",url:"https://www.openstreetmap.org/export/embed.html"},
 {name:"Excalidraw",url:"https://excalidraw.com/"},
 {name:"Photopea",url:"https://www.photopea.com/"},
 {name:"Desmos",url:"https://www.desmos.com/calculator"},
 {name:"Piskel",url:"https://www.piskelapp.com/"}
];
const allApps=()=>[...BUILTIN,...apps];
const getApp=id=>allApps().find(a=>a.id===id);
function iconHTML(a,size){const st=size?`style="${a.custom?`width:${size}px;height:${size}px`:`font-size:${size}px`}"`:"";
  return a.custom?`<img class="ico" ${st} src="${esc(a.icon||fallbackIcon)}" alt="" onerror="this.onerror=null;this.src='${fallbackIcon}'">`
  :`<i class="${esc(a.fa)}" ${st} style="color:${a.color};${size?`font-size:${size}px`:""}"></i>`}

/* ---------- DESKTOP / START / TASKBAR ---------- */
const coarse=matchMedia("(pointer:coarse)").matches;
function renderDesktop(){
  const d=$("#desktop");d.innerHTML="";
  allApps().forEach(a=>{
    const b=document.createElement("button");b.className="desktop-icon";
    b.innerHTML=iconHTML(a)+(S.showLabels?`<span>${esc(a.name)}</span>`:"");b.title=a.name;
    const single=S.openMode==="single"||(S.openMode==="auto"&&coarse);
    b.onclick=()=>{if(single)openApp(a.id);else{$$(".desktop-icon").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")}};
    b.ondblclick=()=>{if(!single)openApp(a.id)};
    d.appendChild(b);
  });
  renderStart();renderTaskbar();
}
function renderStart(){
  const q=$("#startSearch").value.toLowerCase(),box=$("#startApps");box.innerHTML="";
  allApps().filter(a=>a.name.toLowerCase().includes(q)).forEach(a=>{
    const b=document.createElement("button");b.className="start-app";b.innerHTML=iconHTML(a,25)+`<span>${esc(a.name)}</span>`;
    b.onclick=()=>openApp(a.id);box.appendChild(b);
  });
}
$("#startSearch").oninput=renderStart;
$("#startSearch").onkeydown=e=>{if(e.key==="Enter"){const f=allApps().find(a=>a.name.toLowerCase().includes(e.target.value.toLowerCase()));if(f)openApp(f.id)}};
function toggleStart(){const m=$("#startMenu");m.hidden=!m.hidden;if(!m.hidden){$("#startSearch").value="";renderStart();if(!coarse)$("#startSearch").focus()}}
function closeStart(){$("#startMenu").hidden=true}
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#startMenu,#dock,#topbar"))closeStart()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeStart()});
function exitOS(){if(S.exitUrl&&validURL(S.exitUrl))location.href=S.exitUrl;else location.reload()}
function powerMenu(){toggleStart()}
function toggleFS(){const d=document,r=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);
  else(r.requestFullscreen||r.webkitRequestFullscreen||(()=>toast("Fullscreen not supported on this device"))).call(r)}
if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen))$("#fsBtn").style.display="none";
function updateClock(){const o={hour:"2-digit",minute:"2-digit",hour12:!S.clock24};if(S.seconds)o.second="2-digit";
  $("#clock").textContent=new Date().toLocaleTimeString([],o)}
setInterval(updateClock,1000);

/* ---------- WINDOW MANAGER ---------- */
function openApp(id,args={},key=id){
  closeStart();
  const app=getApp(id);if(!app)return;
  if(W[key]){const w=W[key];w.style.display="flex";focusWin(key);if(w.onArgs)w.onArgs(args);return}
  const lw=$("#windowLayer").clientWidth,lh=$("#windowLayer").clientHeight;
  const w0=Math.min(860,lw-30),h0=Math.min(600,lh-30),n=Object.keys(W).length%6*22;
  const win=document.createElement("section");win.className="window";
  Object.assign(win.style,{width:w0+"px",height:h0+"px",left:Math.max(0,(lw-w0)/2+n-50)+"px",top:Math.max(0,(lh-h0)/2+n-30)+"px"});
  win.innerHTML=`<header class="win-header"><div class="row" style="min-width:0">${iconHTML(app,18)}<span class="win-title">${esc(app.name)}</span></div>
   <div class="win-controls"><button class="min" title="Minimize"><i class="fa-solid fa-minus"></i></button><button class="max" title="Maximize"><i class="fa-regular fa-square"></i></button><button class="close" title="Close"><i class="fa-solid fa-xmark"></i></button></div></header>
   <div class="win-body"></div><div class="resize"></div>`;
  win.cleanup=[];win.key=key;win.appId=id;
  win.setTitle=t=>{$(".win-title",win).textContent=t;if(win.classList.contains("active"))$("#activeTitle").textContent=t};
  $(".close",win).onclick=()=>closeWin(key);
  $(".min",win).onclick=()=>minWin(key);
  const mx=()=>win.classList.toggle("maxed");
  $(".max",win).onclick=mx;$(".win-header",win).ondblclick=e=>{if(!e.target.closest("button")&&innerWidth>=650)mx()};
  win.addEventListener("pointerdown",()=>focusWin(key),true);
  drag(win);resize(win);
  $("#windowLayer").appendChild(win);W[key]=win;
  try{app.init($(".win-body",win),win,args,app)}catch(e){console.error(e);$(".win-body",win).textContent="This app crashed: "+e.message}
  focusWin(key);
}
function focusWin(k){const w=W[k];if(!w)return;Z++;Object.values(W).forEach(x=>x.classList.remove("active"));w.classList.add("active");w.style.zIndex=Z;
  $("#activeTitle").textContent=$(".win-title",w).textContent;renderTaskbar()}
function closeWin(k){const w=W[k];if(!w)return;w.cleanup.forEach(f=>{try{f()}catch{}});w.remove();delete W[k];$("#activeTitle").textContent="Desktop";renderTaskbar()}
function minWin(k){const w=W[k];if(!w)return;w.style.display="none";w.classList.remove("active");$("#activeTitle").textContent="Desktop";renderTaskbar()}
function renderTaskbar(){
  const t=$("#taskbar");t.innerHTML="";
  Object.entries(W).forEach(([k,w])=>{const a=getApp(w.appId);if(!a)return;

/* ---------- CALCULATOR ---------- */
function calc(s){
  const t=s.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/\s/g,"");let i=0;
  const num=()=>{if(t[i]==="("){i++;const v=expr();if(t[i]!==")")throw 0;i++;return v}
    if(t[i]==="-"){i++;return-num()}if(t[i]==="+"){i++;return num()}
    const m=/^(\d+\.?\d*|\.\d+)/.exec(t.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const term=()=>{let v=num();while("*/%".includes(t[i]||"#")){const o=t[i++],r=num();v=o==="*"?v*r:o==="/"?v/r:v%r}return v};
  const expr=()=>{let v=term();while("+-".includes(t[i]||"#")){const o=t[i++],r=term();v=o==="+"?v+r:v-r}return v};
  const r=expr();if(i!==t.length||!isFinite(r))throw 0;return r;
}
function initCalc(b){

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">${["C","(",")","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","⌫","="].map(v=>`<button class="sec" data-v="${v}" style="padding:14px">${v}</button>`).join("")}</div></div>`;
  const d=$("#cd",b),h=$("#ch",b);let ex="0";

    const m=$("audio,video",st);if(m)m.onended=()=>{const i=list.indexOf(it);if(list[i+1])play(list[i+1])}}
  function draw(){pl.innerHTML=list.map((it,i)=>`<div class="li" data-i="${i}" style="cursor:pointer"><i class="fa-solid fa-play"></i><div class="grow">${esc(it.name)}</div></div>`).join("");
    $$("[data-i]",pl).forEach(r=>r.onclick=()=>play(list[+r.dataset.i]))}
  $("input[type=file]",b).onchange=e=>{[...e.target.files].forEach(f=>{const u=URL.createObjectURL(f);urls.push(u);list.push({name:f.name,src:u,type:f.type||"audio/"})});draw();if(list[0])play(list[list.length-e.target.files.length]);e.target.value=""};
  function link(v){v=v.trim();if(!validURL(v))return toast("Enter a valid link");
    const y=v.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
    const it=y?{name:"YouTube video",yt:"https://www.youtube.com/embed/"+y[1]+"?autoplay=1"}:{name:v.split("/").pop()||v,src:v,type:/\.(mp4|webm|ogv|mov)(\?|$)/i.test(v)?"video/":/\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(v)?"image/":"audio/"};
    list.push(it);draw();play(it)}
  $(".btn",b).onclick=()=>link($("input.ui",b).value);$("input.ui",b).onkeydown=e=>{if(e.key==="Enter")link(e.target.value)};
  win.onArgs=a=>{const f=files.find(x=>x.id===a.fileId);if(f){const it={name:f.name,src:f.data,type:f.mime};list.push(it);draw();play(it)}};
  win.onArgs(args);
}

/* ---------- TERMINAL ---------- */
function initTerm(b,win){
  b.innerHTML=`<div class="term" id="t"></div>`;const t=$("#t",b);let hist=[],hi=0;
  const out=s=>{t.insertBefore(document.createTextNode(s+"\n"),$("#line",t))};
  t.innerHTML=`<span id="line">$ <input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false"></span>`;
  const inp=$("#ti",t);t.onclick=()=>inp.focus();
  out("AuraOS terminal. Type 'help'.");
  const cmds={
   help:()=>"Commands: help ls cat rm touch echo open apps date theme accent wallpaper clear whoami fullscreen",
   ls:()=>files.map(f=>f.name).join("\n")||"(no files)",
   cat:a=>{const f=files.find(x=>x.name===a.join(" "));return f?(isText(f)?f.data:"(binary file)"):"No such file"},
   rm:a=>{const n=files.length;files=files.filter(x=>x.name!==a.join(" "));saveFiles();return n>files.length?"Removed":"No such file"},
   touch:a=>{const n=a.join(" ");if(!n)return"Usage: touch name";files.push({id:uid(),name:uniqueName(n),mime:"text/plain",text:true,data:"",mtime:Date.now()});saveFiles();return"Created"},
   echo:a=>a.join(" "),
   open:a=>{const q=a.join(" ").toLowerCase(),x=allApps().find(p=>p.id===q||p.name.toLowerCase()===q);if(!x)return"Unknown app";openApp(x.id);return"Opening "+x.name},
   apps:()=>allApps().map(a=>a.name).join(", "),
   date:()=>new Date().toString(),
   whoami:()=>"user@auraos",
   theme:a=>{if(!["dark","light"].includes(a[0]))return"Usage: theme dark|light";S.theme=a[0];saveS();applySettings();return"OK"},
   accent:a=>{if(!/^#[0-9a-f]{6}$/i.test(a[0]||""))return"Usage: accent #rrggbb";S.accent=a[0];saveS();applySettings();return"OK"},
   wallpaper:a=>{if(!validURL(a[0]))return"Usage: wallpaper https://image-url";S.wallpaper=a[0];saveS();applySettings();return"OK"},
   fullscreen:()=>{toggleFS();return""},
   clear:()=>{$$("#t",b).forEach(()=>{});t.childNodes.forEach(n=>{if(n.nodeType===3)n.remove()});return""}};
  inp.onkeydown=e=>{
    if(e.key==="Enter"){const v=inp.value.trim();out("$ "+v);inp.value="";if(v){hist.push(v);hi=hist.length;const[c,...a]=v.split(/\s+/);const r=cmds[c]?cmds[c](a):"Command not found: "+c;if(r)out(r)}t.scrollTop=t.scrollHeight}
    if(e.key==="ArrowUp"){hi=Math.max(0,hi-1);inp.value=hist[hi]||"";e.preventDefault()}
    if(e.key==="ArrowDown"){hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||""}};
  setTimeout(()=>{if(!coarse)inp.focus()},50);
}

/* ---------- APP STORE ---------- */
function installApp(name,url,icon,mode){
  const u=validURL(url);if(!name||!u)return toast("Enter a valid name and URL");
  apps.push({id:"web_"+uid(),name:name.slice(0,40),url:u,icon:validURL(icon||"")||favicon(u),custom:true,mode:mode||"direct"});
  saveApps();renderDesktop();dispatchEvent(new Event("apps"));toast(name+" installed");
}
BUILTIN.forEach(a=>a);
function initStore(b,win){
  b.innerHTML=`<div class="pad" style="overflow:auto"><h3 style="margin:0 0 4px">Featured web apps</h3><div class="muted">These sites usually allow embedding. Installed apps run inside AuraOS windows.</div><div id="cat"></div>
  <h3 style="margin:18px 0 6px">Install any website</h3><div class="muted" style="margin-bottom:8px">Sites that block embedding need a proxy (Settings → Browser).</div>
  <input class="ui" id="an" placeholder="App name" maxlength="40" style="margin-bottom:8px"><input class="ui" id="au" placeholder="https://example.com" style="margin-bottom:8px"><input class="ui" id="ai" placeholder="Custom icon URL (optional)" style="margin-bottom:8px">
  <select class="ui" id="am" style="margin-bottom:10px"><option value="direct">Load directly</option><option value="proxy">Load through proxy</option></select>
  <div class="row"><img id="ap" width="34" height="34" src="${fallbackIcon}" alt=""><button class="btn" id="ab">Install app</button></div></div>`;
  const cat=$("#cat",b);
  function draw(){cat.innerHTML=CATALOG.map(c=>{const inst=apps.some(a=>a.url===c.url);return`<div class="li"><img src="${esc(favicon(c.url))}" alt=""><div class="grow"><div style="font-size:12px;font-weight:600">${esc(c.name)}</div><div class="muted">${esc(c.url)}</div></div><button class="${inst?"sec":"btn"}" data-u="${esc(c.url)}" ${inst?"disabled":""}>${inst?"Installed":"Install"}</button></div>`}).join("");
    $$("[data-u]:not([disabled])",cat).forEach(x=>x.onclick=()=>{const c=CATALOG.find(y=>y.url===x.dataset.u);installApp(c.name,c.url)})}
  draw();addEventListener("apps",draw);win.cleanup.push(()=>removeEventListener("apps",draw));
  const pv=()=>{const i=validURL($("#ai",b).value),u=validURL($("#au",b).value);$("#ap",b).src=i||(u?favicon(u):fallbackIcon)};$("#au",b).oninput=$("#ai",b).oninput=pv;
  $("#ab",b).onclick=()=>{installApp($("#an",b).value.trim(),$("#au",b).value.trim(),$("#ai",b).value.trim(),$("#am",b).value);$("#an",b).value=$("#au",b).value=$("#ai",b).value="";pv()};
}

/* ---------- SETTINGS ---------- */
function sel(k,o){return`<select class="ui" data-k="${k}">${o.map(([v,l])=>`<option value="${v}" ${S[k]==v?"selected":""}>${l}</option>`).join("")}</select>`}
function rng(k,min,max,step){return`<input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${S[k]}" style="width:100%">`}
function chk(k,l){return`<label style="display:flex;gap:8px;align-items:center;font-size:12px"><input type="checkbox" data-k="${k}" ${S[k]?"checked":""}> ${l}</label>`}
function initSettings(b,win){
  const tabs=[["look","fa-palette","Appearance"],["win","fa-window-restore","Windows"],["desk","fa-desktop","Desktop"],["web","fa-globe","Browser"],["apps","fa-cubes","Apps"],["sys","fa-microchip","System"]];
  b.innerHTML=`<div class="set"><nav>${tabs.map(t=>`<button data-t="${t[0]}"><i class="fa-solid ${t[1]}"></i>${t[2]}</button>`).join("")}</nav><main></main></div>`;
  const main=$("main",b);let cur="look";
  const pages={
   look:()=>`<div class="grp"><h3>Theme</h3><label>Mode</label>${sel("theme",[["dark","Dark"],["light","Light"]])}<label>Accent color</label><div class="row" style="flex-wrap:wrap">${["#6366f1","#3b82f6","#10b981","#f59e0b","#ef4444","#ec4899","#8b5cf6","#06b6d4"].map(c=>`<button class="sw" data-c="${c}" style="background:${c}" title="${c}"></button>`).join("")}<input type="color" data-k="accent" value="${S.accent}" style="width:36px;height:34px;border:0;background:none"></div></div>
     <div class="grp"><h3>Wallpaper</h3><div class="row" style="flex-wrap:wrap;margin-bottom:6px">${WALLS.map((w,i)=>`<button class="wp" data-w="${i}" style="background-image:${/^http/.test(w)?`url('${w}')`:w}"></button>`).join("")}</div>
     <label>Image URL</label><div class="row"><input class="ui" id="wu" placeholder="https://…/image.jpg"><button class="btn" id="wa">Apply</button></div><label>Or upload from your device</label><input type="file" id="wf" accept="image/*" class="ui"></div>`,
   win:()=>`<div class="grp"><h3>Windows</h3><label>Transparency</label>${rng("opacity",.4,1,.02)}<label>Background blur</label>${rng("blur",0,40,1)}<label>Corner radius</label>${rng("rad",0,28,1)}<label>Text size</label>${rng("fs",11,20,1)}<label>&nbsp;</label>${chk("anim","Window animations")}</div>`,
   desk:()=>`<div class="grp"><h3>Desktop</h3><label>Icon size</label>${rng("iconSize",24,64,2)}<label>&nbsp;</label>${chk("showLabels","Show icon labels")}<label>Open apps with</label>${sel("openMode",[["auto","Automatic (tap on touch, double-click on mouse)"],["single","Single click / tap"],["double","Double click"]])}</div>
     <div class="grp"><h3>Clock</h3>${chk("clock24","24-hour time")}<label>&nbsp;</label>${chk("seconds","Show seconds")}</div>`,
   web:()=>`<div class="grp"><h3>Browser</h3><label>Search engine (use %s for the query)</label><input class="ui" data-k="search" value="${esc(S.search)}"><div class="muted">Many search engines forbid embedding. Wikipedia works directly; others need a proxy.</div>
     <label>Home page</label><input class="ui" data-k="home" value="${esc(S.home)}"><div class="muted">Use aura://start for the built-in start page.</div><label>Default load mode</label>${sel("embedDefault",[["direct","Direct"],["proxy","Through proxy"]])}</div>
     <div class="grp"><h3>Proxy</h3><div class="muted">URL template of a proxy you control that strips frame-blocking headers. Use {url} where the encoded address goes, e.g. <code>https://your-worker.workers.dev/?u={url}</code>. Only use proxies you trust, since they see the pages you load.</div><label>Proxy template</label><input class="ui" data-k="proxy" placeholder="https://your-worker.workers.dev/?u={url}" value="${esc(S.proxy)}"></div>`,
   apps:()=>`<div class="grp"><h3>Installed web apps</h3>${apps.length?apps.map(a=>`<div class="li"><img src="${esc(a.icon||fallbackIcon)}" alt=""><div class="grow"><div style="font-size:12px;font-weight:600">${esc(a.name)}</div><div class="muted">${esc(a.url)}</div></div><select class="ui" data-m="${a.id}" style="width:auto"><option value="direct" ${a.mode!=="proxy"?"selected":""}>Direct</option><option value="proxy" ${a.mode==="proxy"?"selected":""}>Proxy</option></select><button class="sec" data-e="${a.id}">Edit</button><button class="danger" data-x="${a.id}">Remove</button></div>`).join(""):'<div class="muted">No web apps installed.</div>'}<div style="margin-top:10px"><button class="btn" id="gs">Open App Store</button></div></div>`,
   sys:()=>{let used=0;try{Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>used+=localStorage[k].length)}catch{}
     return`<div class="grp"><h3>System</h3><label>Exit URL (power button → Exit)</label><input class="ui" data-k="exitUrl" value="${esc(S.exitUrl)}"><label>Storage used by AuraOS</label><div class="muted">${(used/1024).toFixed(1)} KB of roughly 5,000 KB</div><div style="margin-top:8px"><button class="sec" onclick="toggleFS()">Toggle fullscreen</button></div></div>
     <div class="grp"><h3>Backup & restore</h3><div class="muted">Settings, apps, files and tasks in one JSON file.</div><div class="row" style="margin-top:8px"><button class="sec" id="bx">Export</button><label class="sec" style="cursor:pointer">Import<input type="file" id="bi" accept=".json,application/json" hidden></label></div></div>
     <div class="grp"><h3 style="color:#f87171">Reset</h3><div class="muted">Deletes all AuraOS data in this browser.</div><button class="danger" id="rs" style="margin-top:8px">Factory reset</button></div>
     <div class="muted" style="padding-top:10px">AuraOS v6 · data is stored locally in this browser.</div>`}
  };
  function render(){
    $$("nav button",b).forEach(x=>x.classList.toggle("on",x.dataset.t===cur));
    main.innerHTML=pages[cur]();
    $$("[data-k]",main).forEach(i=>{const h=()=>{const k=i.dataset.k;S[k]=i.type==="checkbox"?i.checked:(i.type==="range"?+i.value:i.value);saveS();applySettings();if(["iconSize","showLabels","openMode","search"].includes(k))renderDesktop();if(k==="theme")render()};i.oninput=h;i.onchange=h});
    $$("[data-c]",main).forEach(x=>x.onclick=()=>{S.accent=x.dataset.c;saveS();applySettings();render()});
    $$("[data-w]",main).forEach(x=>x.onclick=()=>{S.wallpaper=WALLS[+x.dataset.w];saveS();applySettings()});
    const wa=$("#wa",main);if(wa)wa.onclick=()=>{const u=validURL($("#wu",main).value);if(!u)return toast("Enter a valid image URL");S.wallpaper=u;saveS();applySettings()};
    const wf=$("#wf",main);if(wf)wf.onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image(),u=URL.createObjectURL(f);
      img.onload=()=>{const sc=Math.min(1,1920/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        S.wallpaper=c.toDataURL("image/jpeg",.8);URL.revokeObjectURL(u);if(saveS()!==false)applySettings()};img.onerror=()=>toast("Could not read image");img.src=u};
    $$("[data-m]",main).forEach(x=>x.onchange=()=>{apps.find(a=>a.id===x.dataset.m).mode=x.value;saveApps()});
    $$("[data-x]",main).forEach(x=>x.onclick=()=>{if(!confirm("Remove this app?"))return;closeWin(x.dataset.x);apps=apps.filter(a=>a.id!==x.dataset.x);saveApps();renderDesktop();render()});
    $$("[data-e]",main).forEach(x=>x.onclick=()=>{const a=apps.find(y=>y.id===x.dataset.e),n=prompt("App name",a.name);if(!n)return;const u=validURL(prompt("App URL",a.url)||"");if(!u)return toast("Invalid URL");a.name=n.slice(0,40);a.url=u;a.icon=favicon(u);saveApps();closeWin(a.id);renderDesktop();render()});
    const gs=$("#gs",main);if(gs)gs.onclick=()=>openApp("store");
    const bx=$("#bx",main);if(bx)bx.onclick=()=>download("AuraOS-backup.json",new Blob([JSON.stringify({v:6,S,apps,files,tasks})],{type:"application/json"}));
    const bi=$("#bi",main);if(bi)bi.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!d.S||!Array.isArray(d.apps))throw 0;if(!confirm("Replace current AuraOS data with this backup?"))return;
      ss("settings",{...DEF,...d.S});ss("apps",d.apps.filter(a=>a&&a.custom&&validURL(a.url)));ss("files",Array.isArray(d.files)?d.files:[]);ss("tasks",Array.isArray(d.tasks)?d.tasks:[]);location.reload()}catch{toast("Invalid backup file")}};
    const rs=$("#rs",main);if(rs)rs.onclick=()=>{if(!confirm("Factory reset? This deletes all AuraOS data in this browser."))return;try{Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>localStorage.removeItem(k))}catch{}location.reload()};
  }
  b.addEventListener("click",e=>{const t=e.target.closest("nav [data-t]");if(t){cur=t.dataset.t;render()}});
  const re=()=>{if(cur==="apps")render()};addEventListener("apps",re);win.cleanup.push(()=>removeEventListener("apps",re));
  render();
}

/* ---------- BOOT ---------- */
applySettings();renderDesktop();
</script>
</body>
</html>
